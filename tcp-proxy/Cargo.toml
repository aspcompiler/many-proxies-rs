[package]
authors = ["Li Chen <dotneteer@gmail.com>"]
name = "tcp-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
futures = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
