[package]
authors = ["Li Chen <dotneteer@gmail.com>"]
name = "tls-init"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rustls = "0.21"
rustls-pemfile = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
